name: Assemble immutable planning reference

on:
  push:
    branches:
      - docs/project-management-foundation

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/project-management-foundation

      - name: Assemble and verify immutable reference
        shell: bash
        run: |
          set -euo pipefail
          target='docs/project-management/00-reference/OpsKat_项目深度分析与差异化产品规划_增强版.md'
          mkdir -p "$(dirname "$target")"
          cat .reference-chunks/part-* | base64 --decode | gzip --decompress > "$target"
          echo '51799aaf06fb9ab314f7a3c21ff78e4f8535f7442f85f3f7689150a37a739f3b  docs/project-management/00-reference/OpsKat_项目深度分析与差异化产品规划_增强版.md' | sha256sum --check
          rm -rf .reference-chunks
          rm -f .github/workflows/assemble-reference.yml

      - name: Commit assembled reference
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: assemble immutable planning reference'
          git push origin HEAD:docs/project-management-foundation
