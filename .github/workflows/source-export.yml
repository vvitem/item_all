name: Source Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-bindings:
    if: github.head_ref == 'feat/m0-004-sqlite-storage'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Enable exact pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
          test "$(pnpm --version)" = '11.12.0'

      - name: Install Wails dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install exact Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build frontend for Go embed
        shell: bash
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Generate bindings
        shell: bash
        run: |
          GOFLAGS='-tags=webkit2_41' wails generate module
          find frontend/wailsjs -type f -exec chmod 0644 {} +
          tar -czf wails-bindings.tar.gz frontend/wailsjs

      - name: Upload generated bindings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: item-all-wails-bindings
          path: wails-bindings.tar.gz
          if-no-files-found: error
          retention-days: 1
