name: Source Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare-sqlite-deps:
    if: github.head_ref == 'feat/m0-004-sqlite-storage'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Generate exact SQLite module state
        shell: bash
        run: |
          mkdir -p internal/storage/sqlite
          cat > internal/storage/sqlite/driver.go <<'EOF'
          package sqlite

          import _ "modernc.org/sqlite"
          EOF
          go get modernc.org/sqlite@v1.53.0
          go mod edit -require=modernc.org/libc@v1.73.4
          go mod tidy
          test "$(go list -m -f '{{.Version}}' modernc.org/sqlite)" = 'v1.53.0'
          test "$(go list -m -f '{{.Version}}' modernc.org/libc)" = 'v1.73.4'
          tar -C "$(go env GOPATH)" -czf go-pkg-sqlite.tar.gz pkg

      - name: Upload SQLite dependency snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: item-all-sqlite-deps
          path: |
            go.mod
            go.sum
            go-pkg-sqlite.tar.gz
          if-no-files-found: error
          retention-days: 1
