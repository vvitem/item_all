name: Source Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'feat/m0-004-sqlite-storage'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Archive tracked source
        shell: bash
        run: git ls-files -z | tar --null -T - -czf item_all-source.tar.gz

      - name: Upload source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: item-all-source
          path: item_all-source.tar.gz
          if-no-files-found: error
          retention-days: 1

  export-dev-environment:
    if: github.head_ref == 'feat/m0-004-sqlite-storage'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Enable exact pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
          test "$(pnpm --version)" = '11.12.0'

      - name: Populate dependencies
        shell: bash
        run: |
          go mod download
          pnpm --dir frontend install --frozen-lockfile

      - name: Archive toolchains and caches
        shell: bash
        run: |
          go_root="$(go env GOROOT)"
          go_parent="$(dirname "$go_root")"
          go_name="$(basename "$go_root")"
          tar -C "$go_parent" -czf go-toolchain.tar.gz "$go_name"
          tar -C "$(go env GOPATH)" -czf go-pkg.tar.gz pkg

          node_root="$(dirname "$(dirname "$(command -v node)")")"
          node_parent="$(dirname "$node_root")"
          node_name="$(basename "$node_root")"
          tar -C "$node_parent" -czf node-toolchain.tar.gz "$node_name"

          if [[ -d "$HOME/.cache/node/corepack" ]]; then
            tar -C "$HOME/.cache/node" -czf corepack-cache.tar.gz corepack
          else
            tar -czf corepack-cache.tar.gz --files-from /dev/null
          fi
          tar -C frontend -czf frontend-node-modules.tar.gz node_modules

      - name: Upload development environment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: item-all-dev-environment
          path: |
            go-toolchain.tar.gz
            go-pkg.tar.gz
            node-toolchain.tar.gz
            corepack-cache.tar.gz
            frontend-node-modules.tar.gz
          if-no-files-found: error
          retention-days: 1
