name: Source Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'feat/m0-004-sqlite-storage'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Archive tracked source
        shell: bash
        run: git ls-files -z | tar --null -T - -czf item_all-source.tar.gz

      - name: Upload source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: item-all-source
          path: item_all-source.tar.gz
          if-no-files-found: error
          retention-days: 1
