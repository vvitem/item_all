name: M0-002 bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/m0-002-project-scaffold

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false

      - name: Cache Wails and Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/wails.exe
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: wails-${{ runner.os }}-v2.13.0-go1.26.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
          if ((pnpm --version) -ne '11.12.0') { throw 'Unexpected pnpm version' }

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $goBin = Join-Path (go env GOPATH) 'bin'
          $wailsPath = Join-Path $goBin 'wails.exe'
          if (-not (Test-Path $wailsPath)) {
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          }
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Append
          $wailsVersion = (& $wailsPath version | Out-String).Trim()
          Write-Host $wailsVersion
          if ($wailsVersion -notmatch 'v2\.13\.0') { throw 'Unexpected Wails version' }

      - name: Verify official platform resources
        shell: pwsh
        run: |
          if (-not (Test-Path build\appicon.png)) { throw 'Missing appicon.png' }
          if (-not (Test-Path build\windows\icon.ico)) { throw 'Missing Windows icon' }
          if (-not (Test-Path build\windows\info.json)) { throw 'Missing Windows version template' }
          if (-not (Test-Path build\windows\wails.exe.manifest)) { throw 'Missing Windows manifest' }
          if (Select-String -Path wails.json -Pattern 'applicationID' -Quiet) { throw 'Unsupported applicationID field found' }

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run frontend contracts
        shell: pwsh
        run: |
          pnpm --dir frontend test:run -- App.test.tsx
          pnpm --dir frontend typecheck
          pnpm --dir frontend lint
          pnpm --dir frontend build
          if (-not (Test-Path frontend\dist\index.html)) { throw 'Frontend production build is missing' }

      - name: Run Go contracts against production frontend
        shell: pwsh
        run: |
          go mod tidy
          go test ./... -v
          go test -race ./internal/buildinfo

      - name: Verify generated Wails bindings
        shell: pwsh
        run: |
          wails generate module
          $declaration = Get-Content frontend\wailsjs\go\main\App.d.ts -Raw
          if ($declaration -notmatch 'GetAppInfo') { throw 'GetAppInfo binding was not generated' }
          if ($declaration -match 'Shell|Database|Environment|FileSystem|Network') { throw 'Unexpected binding capability generated' }
          $exports = ([regex]::Matches($declaration, 'export function')).Count
          if ($exports -ne 1) { throw "Expected exactly one binding, found $exports" }
          git diff --exit-code -- go.mod go.sum frontend/wailsjs frontend/pnpm-lock.yaml
