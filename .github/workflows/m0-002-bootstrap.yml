name: M0-002 development smoke

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  development-smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/m0-002-project-scaffold

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false

      - name: Cache Wails and Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/wails.exe
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: wails-${{ runner.os }}-v2.13.0-go1.26.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Enable pnpm and install Wails
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
          $goBin = Join-Path (go env GOPATH) 'bin'
          $wailsPath = Join-Path $goBin 'wails.exe'
          if (-not (Test-Path $wailsPath)) {
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          }
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location frontend
          pnpm install --frozen-lockfile
          Set-Location ..

      - name: Verify Wails development readiness
        shell: pwsh
        run: |
          $stdout = Join-Path $env:GITHUB_WORKSPACE 'wails-dev.stdout.log'
          $stderr = Join-Path $env:GITHUB_WORKSPACE 'wails-dev.stderr.log'
          $wailsPath = (Get-Command wails).Source
          $dev = Start-Process -FilePath $wailsPath -ArgumentList 'dev' -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $deadline = (Get-Date).AddSeconds(120)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            $combined = (Get-Content $stdout,$stderr -Raw -ErrorAction SilentlyContinue) -join "`n"
            if ($combined -match 'Environment created successfully' -and $combined -match 'Watching \(sub\)/directory') {
              $ready = $true
              break
            }
            if ($dev.HasExited) { break }
            Start-Sleep -Seconds 5
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          cmd /c "taskkill /PID $($dev.Id) /T /F" | Out-Null
          if (-not $ready) { throw 'Wails development readiness markers were not observed' }
