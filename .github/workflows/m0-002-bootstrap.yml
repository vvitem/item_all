name: M0-002 bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  diagnose-frontend-install:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/m0-002-project-scaffold

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate

      - name: Capture environment and frozen install output
        id: install
        shell: pwsh
        continue-on-error: true
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'pnpm-install.log'
          "node=$(node --version)" | Set-Content $log
          "pnpm=$(pnpm --version)" | Add-Content $log
          "package_sha=$((Get-FileHash frontend\package.json -Algorithm SHA256).Hash)" | Add-Content $log
          "lock_sha=$((Get-FileHash frontend\pnpm-lock.yaml -Algorithm SHA256).Hash)" | Add-Content $log
          Set-Location frontend
          $output = & pnpm install --frozen-lockfile --reporter=append-only 2>&1
          $exitCode = $LASTEXITCODE
          Set-Location ..
          $output | ForEach-Object { $_.ToString() } | Add-Content $log
          "exit_code=$exitCode" | Add-Content $log
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-diagnostic
          path: pnpm-install.log
          if-no-files-found: error

      - name: Preserve failure result
        if: steps.install.outcome == 'failure'
        shell: pwsh
        run: throw 'Frozen frontend install failed; inspect pnpm-install-diagnostic'
