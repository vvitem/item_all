name: M0-002 final review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  frontend-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m0-002-project-scaffold
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.12.0 --activate
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run final frontend verification
        working-directory: frontend
        run: |
          pnpm test:run
          pnpm typecheck
          pnpm lint
          pnpm build
